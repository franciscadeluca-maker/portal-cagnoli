<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Portal de Vendedores Cagnoli · Prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F4F2F1;--card:#fff;--ink:#241C1D;--mut:#6B6163;--line:#E5DFDD;--p:#7A1F2B;--p2:#5E1520;--pl:#F6E4E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1A1516;--card:#251E20;--ink:#F2ECEC;--mut:#B5A9AB;--line:#3A3033;--pl:#3A1E23;color-scheme:dark}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--p2);color:#fff;padding:16px;display:flex;flex-direction:column;gap:4px}
.side img{width:120px;border-radius:12px;margin:0 auto 14px;display:block}
.nv{background:none;border:0;color:#fff;text-align:left;padding:11px 12px;border-radius:8px;font:inherit;cursor:pointer;display:flex;justify-content:space-between;gap:6px;min-height:44px;align-items:center}
.nv:hover{background:#ffffff1f}.nv.on{background:#fff;color:var(--p2);font-weight:700}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:#E8854A;color:#241C1D;font-weight:700}
.main{min-width:0}.top{display:flex;gap:14px;align-items:center;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top select{width:auto}.sp{flex:1}.bell{position:relative;font-size:20px}.bell b{position:absolute;top:-6px;right:-8px;background:var(--p);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.av{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700}
.w{padding:24px 28px;max-width:1300px}h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.gs{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.k{font-size:12px;color:var(--mut)}.big{font-size:24px;font-weight:700}.m{color:var(--mut);font-size:13px}
.p{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.r{background:#FBE4E4;color:#8E1620}.a{background:#FFEBD6;color:#8A3E0B}.gr{background:#DFF2E3;color:#17602B}.b{background:#E3E8F8;color:#26337A}.n{background:#ECE8E6;color:#4B4244}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-size:12px;padding:9px 8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line)}tr.rw{cursor:pointer}tr.rw:hover td{background:var(--pl)}.nu{text-align:right}.sc{overflow-x:auto}
.bt{background:var(--p);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}.bt.s{background:var(--card);color:var(--p);border:1px solid var(--p)}.bt.d{background:#8E1620}.bt:disabled{opacity:.5}
input,select,textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px;font:inherit;width:100%;min-height:44px}label{font-size:13px;font-weight:600;display:block;margin:10px 0 4px}
.ch{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px}.ch.on{background:var(--p);color:#fff;border-color:var(--p)}
.bar{display:flex;align-items:end;gap:10px;height:120px}.bar div{flex:1;background:var(--p);border-radius:6px 6px 0 0;position:relative;min-height:3px}.bar span{position:absolute;top:-18px;font-size:11px;width:100%;text-align:center}
.hb{height:10px;background:var(--p);border-radius:6px}.note{background:var(--pl);border-left:4px solid var(--p);padding:10px 14px;border-radius:8px;font-size:13px;margin:12px 0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--p)}.tl .off:before{background:var(--line)}
.rc{background:#FFFDF7;color:#241C1D;border:1px dashed #B9AFA0;border-radius:8px;padding:14px;font:13px/1.6 monospace}.blur{filter:blur(2px)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;background:var(--p2);color:#fff;padding:12px 18px;border-radius:10px;z-index:9}
@media(max-width:900px){.app{grid-template-columns:1fr}.gs{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.side img{display:none}}
.hl{fill:transparent;stroke:transparent;cursor:pointer}.hl.on{fill:#FFD54A66;stroke:#E8A400;stroke-width:3}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}.ovh{display:flex;gap:14px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}.ovb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(380px,2fr)}
.vw{background:#2B2526;display:flex;flex-direction:column;min-height:0;color:#fff}.vwt{display:flex;gap:8px;padding:8px 14px;align-items:center}.vwt .bt{min-height:36px;padding:4px 14px}.vws{flex:1;overflow:auto;padding:16px}.vws svg{display:block;margin:0 auto;max-width:none;box-shadow:0 6px 30px #0009;background:#fff;border-radius:6px}
.fm{overflow:auto;padding:18px 22px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}.fd{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px}.fd.ok{border-color:#2E7D4F}.fd.on{box-shadow:0 0 0 2px var(--p)}
@media(max-width:900px){.ovb{grid-template-columns:1fr;overflow:auto}.vws{height:60vh;flex:none}.fm{overflow:visible}}
</style></head><body><div id="app"></div>
